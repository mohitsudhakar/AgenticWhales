<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgenticWhales">
  <!-- Coach-brand tile: the whale in ink on cream (was the fund-era gradient). -->
  <rect width="64" height="64" rx="14" ry="14" fill="#FAF6EE"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#E7E0D2" stroke-width="2"/>
  <!-- Whale silhouette: body + tail fluke in one path; reads at 16x16. -->
  <path fill="#1A1A17" d="
    M 11 38
    C 11 27, 22 21, 34 21
    C 44 21, 50 25, 52 31
    L 60 25
    L 58 34
    L 60 43
    L 52 37
    C 50 43, 44 47, 34 47
    C 22 47, 11 41, 11 38 Z"/>
  <!-- Eye -->
  <circle cx="42" cy="32" r="1.6" fill="#FAF6EE"/>
  <!-- Spout in the brand emerald; faint at 16px, characterful at 32+. -->
  <g fill="none" stroke="#1F6F54" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M 22 16 Q 22 11, 26 9"/>
    <path d="M 28 16 Q 30 12, 33 11"/>
  </g>
</svg>
